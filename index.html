teachers(){return `<form class="card" data-f="teachers"><h2>${t('add')}</h2>${inp('full_name','name','text','required')}${inp('phone','tphone','tel','required')}<button>${t('add')}</button></form>`+card(t('teachers'),S.t.map(x=>row(x.full_name,`<small>${esc(x.phone)}</small><small>${S.g.filter(g=>g.teacher_id==x.id).map(g=>esc(g.name)).join(', ')}</small>`,info('teachers',x.id)+del('teachers',x.id))).join(''))},

gate(){const of=s=>S.v.find(v=>v.student_id==s.id),groups=[['notyet',s=>!of(s),'came','go'],['inside',s=>of(s)&&!of(s).left_at,'gone','stop'],['gonelist',s=>of(s)?.left_at,'','']];
return `<div class="card scan"><h2>${t('gate')}</h2><input id="scan" placeholder="${t('scan')}" aria-label="${t('scan')}"><input id="find" type="search" placeholder="${t('search')}: ${t('name')}" aria-label="${t('search')}"></div>${gateCard()}<div class="cols">${groups.map(([h,f,act,c])=>{const l=S.s.filter(f);return `<div class="card col ${c}"><h2>${t(h)}: ${l.length}</h2>${l.map(s=>{const v=of(s);return '<div class="item">'+row(s.full_name,`<small>№${s.id}, ${esc(grp(s.group_id)?.name)}</small><small>${esc(s.parent_phone||s.phone)}</small>${v?`<small>${t('in')} ${hm(v.entered_at)}${v.left_at?`, ${t('left')} ${hm(v.left_at)}`:''}</small>`:''}`,act?`<button class="big ${c}" data-mark="${s.id}">${t(act)}</button>`:'')+'</div>'}).join('')||`<small>${t('empty')}</small>`}</div>`}).join('')}</div>`},
debtors(){const l=S.s.filter(left);return money(l)+card(`${t('debtors')}: ${l.length}`,l.map(s=>row(s.full_name,`<small>${esc(grp(s.group_id)?.name)}, ${esc(s.parent_phone||s.phone)}</small>${status(s)}`,`${info('students',s.id)}<button data-payfor="${s.id}">${t('pay')}</button>`)).join(''))},
settings(){return `<form class="card" data-f="settings">${[['name','cname'],['phone','tphone'],['address','address']].map(([n,k])=>`<label class="full">${t(k)}<input name="${n}" value="${esc(C[n])}" ${n=='name'?'required':''}></label>`).join('')}<label class="full">${t('flogo')}<input type="file" name="logo" accept="image/*"></label><button>${t('save')}</button></form>`}};
let C={name:'Maftuna’s Academy'},rc=null;
const img=v=>/^data:image\/(png|jpeg);base64,[A-Za-z0-9+\/=]+$/.test(v||'')?v:'';
async function brand(){try{const r=(await q(db.from('settings').select('*').eq('id',1)))[0];if(r)C=r}catch(e){console.error(e)}
const mark=img(C.logo)?`<img src="${C.logo}" alt="">`:logo.match(/<svg.*<\/svg>/)?.[0]||logo.match(/<img[^>]*>/)?.[0];logo=`<div class="logo">${mark}<b>${esc(C.name)}</b></div>`;document.title=C.name;
if(img(C.bg))document.documentElement.style.setProperty('--hero',`url(${C.bg})`),document.documentElement.classList.add('photo')}
const shrink=(file,max,type)=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(i.src);ok(c.toDataURL(type,.75))};i.onerror=no;i.src=URL.createObjectURL(file)});
const lines=p=>{const s=stu(p.student_id);return[[t('receipt'),'№'+p.id],[t('name'),s?.full_name],[t('group'),grp(s?.group_id)?.name],[t('month2'),p.month.slice(0,7)],[t('amount'),sum(p.amount)],[t('method'),p.method],['',p.paid_at.slice(0,10)+' '+hm(p.paid_at)]]};
const receipt=()=>rc?`<div class="card" id="receipt">${logo}<small>${esc(C.phone)}</small><small>${esc(C.address)}</small>${lines(rc).map(([a,b])=>`<div class="line"><span>${a}</span><b>${esc(b)}</b></div>`).join('')}<p>${t('thanks')}</p><div class="noprint"><button data-a="print">${t('print')}</button> <button data-a="png">${t('png')}</button> <button class="alt" data-a="rcx">${t('close')}</button></div></div>`:'';
function receiptPng(){const l=[[C.name,''],[C.phone||'',''],[C.address||'',''],...lines(rc),[t('thanks'),'']],c=document.createElement('canvas');c.width=600;c.height=l.length*52+50;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#111';l.forEach(([a,b],i)=>{x.font=(i?'':'bold ')+'24px sans-serif';x.textAlign='left';x.fillText(a,30,55+i*52,540);x.textAlign='right';x.fillText(String(b??''),570,55+i*52,360)});const a=document.createElement('a');a.href=c.toDataURL();a.download=`check-${rc.id}.png`;a.click()}
const langSel=()=>`<select id="lang" aria-label="Language">${['O‘zbekcha','Русский','English'].map((n,i)=>`<option value="${i}" ${i==L?'selected':''}>${n}</option>`).join('')}</select>`;
const tools=()=>`<div class="tools"><div class="seg">${['UZ','RU','EN'].map((n,i)=>`<button type="button" class="${i==L?'on':''}" data-lang="${i}">${n}</button>`).join('')}</div><button type="button" class="alt" data-a="theme" aria-label="Dark mode">${icon('moon')}</button>${ok?`<button type="button" class="alt" data-tab="settings" aria-label="${t('settings')}">${icon('settings')}</button>`:''}</div>`;
let theme='';try{theme=localStorage.getItem('theme')||''}catch(e){}
if(!theme&&window.matchMedia?.('(prefers-color-scheme:dark)').matches)theme='dark';
const setTheme=()=>{if(document.documentElement)document.documentElement.dataset.theme=theme||'light'};setTheme();
const chips=g=>g.days.map(d=>`<span class="chip">${t('days').split(',')[d-1]}</span>`).join('')+`<span class="chip">${time(g)}</span>`;
D.reports=g=>{const k=kids(g.id),[y,m]=om.split('-').map(Number),dates=[];for(let d=1;d<=new Date(Date.UTC(y,m,0)).getUTCDate();d++)if(g.days.includes((new Date(Date.UTC(y,m-1,d)).getUTCDay()+6)%7+1))dates.push(om+'-'+String(d).padStart(2,'0'));
const here=(day,s)=>S.mv.some(v=>v.day==day&&v.student_id==s.id);
return `<div>${S.g.map(x=>`<button class="${x.id==g.id?'':'alt'}" data-open="reports:${x.id}">${esc(x.name)}</button> `).join('')}</div><br><input id="om" type="month" value="${om}" aria-label="month"><div class="card"><h2>${esc(g.name)}</h2>${chips(g)}<small>${t('teacher')}: ${esc(tch(g.teacher_id)?.full_name)}</small></div>`+money(k)+`<div class="cols">`+card(t('lessons'),dates.map(d=>{const n=k.filter(s=>here(d,s)).length,past=d<=now().slice(0,10);return `<div class="line"><span>${d.slice(8)}.${d.slice(5,7)} ${t('days').split(',')[(new Date(d).getUTCDay()+6)%7]}</span><b>${past?n+'/'+k.length:'—'}</b></div>`}).join(''))+card(t('students'),k.map(s=>row(s.full_name,`<small>${t('attend')}: ${dates.filter(d=>here(d,s)).length}</small>${status(s)}`,info('students',s.id))).join(''))+`</div>`};
function gateCard(){const s=stu(sel);if(!s)return '';const v=S.v.find(v=>v.student_id==s.id),c=!v?'go':v.left_at?'':'stop';
return `<div class="card col ${c}" style="max-width:520px;margin:0 auto 14px;text-align:center"><span class="ava" style="width:72px;height:72px;font-size:28px;margin:0 auto 10px">${esc(s.full_name[0])}</span><h1>${esc(s.full_name)}</h1><small>№${s.id} · ${esc(grp(s.group_id)?.name)}</small>${status(s)}${v?`<p><b>${t('in')} ${hm(v.entered_at)}${v.left_at?` · ${t('left')} ${hm(v.left_at)}`:''}</b></p>`:'<br>'}${c?`<button class="big ${c}" style="width:100%;font-size:20px;padding:18px" data-mark="${s.id}">${t(v?'gone':'came')}</button>`:`<p><b>${t('gonelist')}</b></p>`}<p><button class="alt" data-a="close">${t('close')}</button></p></div>`}
D.lessons=g=>{const k=kids(g.id),[y,m]=om.split('-').map(Number),names=t('days').split(','),wd=d=>(new Date(Date.UTC(y,m-1,d)).getUTCDay()+6)%7+1,dates=[];
for(let d=1;d<=new Date(Date.UTC(y,m,0)).getUTCDate();d++)if(g.days.includes(wd(d)))dates.push(d);
return `<div class="card"><h2>${esc(g.name)}</h2><small>${t('teacher')}: ${esc(tch(g.teacher_id)?.full_name)}</small></div><div class="cols">`+card(t('lessons'),g.days.map(d=>`<div class="line"><span>${names[d-1]}</span><b>${time(g)}</b></div>`).join(''))+card(om,dates.map(d=>{const day=om+'-'+String(d).padStart(2,'0'),n=k.filter(s=>S.mv.some(v=>v.day==day&&v.student_id==s.id)).length;return `<div class="line"><span>${day.slice(8)}.${day.slice(5,7)} ${names[wd(d)-1]}</span><b>${day<=now().slice(0,10)?n+'/'+k.length:'—'}</b></div>`}).join(''))+card(`${t('students')}: ${k.length}`,k.map(sline).join(''))+'</div>'};
function body(){if(!det)return V[tab]();const[k,id]=det.split(':'),x={teachers:tch,groups:grp,students:stu,reports:grp,lessons:grp}[k](id);if(!x){det=0;return V[tab]()}
const code=sel&&k=='students'?`<div class="card" style="text-align:center"><canvas id="bc" style="max-width:100%"></canvas><br><button data-a="dl">${t('download')}</button></div>`:'';return `<p><button class="alt" data-a="back">${t('back')}</button></p>`+code+D[k](x)}
function draw(){$('nav').hidden=!ok;const note=msg?`<div class="card ${bad?'red':'green'}" role="status"><b>${esc(msg)}</b></div>`:'';
if(!ok){$('app').innerHTML=`<form class="card" data-f="login" style="max-width:360px;margin:10vh auto">${logo}${tools()}${note}${user?`<button type="button" data-a="out">${t('out')}</button>`:inp('email','email','email','required')+inp('password','pass','password','required')+`<button>${t('login')}</button>`}</form>`;return}
$('nav').innerHTML=['home','lessons','teachers','groups','students','gate','pay','reports'].map(k=>`<button class="${k==tab?'on':''}" data-tab="${k}">${icon(k)}${t(k)}</button>`).join('')+`<button data-a="out">${icon('out')}${t('out')}</button>`;$('nav').insertAdjacentHTML('afterbegin',logo);
$('app').innerHTML=`<header class="top"><div><h1>${t(tab)}</h1><small>${esc(C.name)} · ${now().slice(0,10)} ${esc(C.phone)}</small></div>${tools()}</header>${note}${receipt()}${body()}`;
if(sel&&$('bc')&&window.JsBarcode)JsBarcode('#bc',String(sel),{format:'CODE128',width:3,height:90});
$('scan')?.focus()}
const say=(m,b=false)=>{msg=m;bad=b};
async function run(fn){if(busy)return;busy=true;try{await fn()}catch(e){console.error(e);say(`${t('err')}: ${e.message}`,true)}busy=false;draw()}
async function start(){await brand();const{data}=await db.auth.getSession();user=data.session?.user;ok=false;if(user){ok=(await q(db.from('staff').select('role'))).length>0;if(ok)await load();else say(t('noaccess'),true)}}
async function pick(id){sel=id;if(tab=='pay'){const[y,m]=om.split('-').map(Number),next=new Date(Date.UTC(y,m,1)).toISOString().slice(0,10);visits=(await q(db.from('visits').select('id').eq('student_id',id).gte('day',om+'-01').lt('day',next))).length}}
async function scan(code){const s=stu(code);if(!s){sel=0;return say(t('nf'),true)}
if(tab=='pay'){say('');return pick(s.id)}
say('');sel=s.id;await load()}
async function mark(s){const day=now().slice(0,10),v=(await q(db.from('visits').select('*').eq('student_id',s.id).eq('day',day)))[0];
if(!v){await q(db.from('visits').insert({student_id:s.id,day}));say(`${t('in')}: ${s.full_name}`)}
else if(v.left_at)say(`${t('already')}: ${s.full_name}`,true);
else if(Date.now()-new Date(v.entered_at)<5e3)return;
else{await q(db.from('visits').update({left_at:new Date().toISOString()}).eq('id',v.id));say(`${t('left')}: ${s.full_name}`)}
await load()}
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,kind=f.dataset.f,fd=new FormData(f),o=Object.fromEntries(fd);run(async()=>{
if(kind=='login'){say('');await q(db.auth.signInWithPassword(o));return start()}
if(kind=='settings'){const row={id:1,name:o.name,phone:o.phone,address:o.address};for(const[n,max,type]of[['logo',256,'image/png'],['bg',1100,'image/jpeg']]){const f=fd.get(n);if(f?.size)row[n]=await shrink(f,max,type)}await q(db.from('settings').upsert(row));await brand();return say(t('saved'))}
const digits=v=>(v||'').replace(/\D/g,'').length>=9;
if(kind=='students'&&!digits(o.phone)&&!digits(o.parent_phone))return say(t('needphone'),true);
if(kind=='teachers'&&!digits(o.phone))return say(t('needphone'),true);
if(kind=='groups'){o.days=fd.getAll('days').map(Number);o.teacher_id=o.teacher_id||null}
if(kind=='payments'){o.student_id=sel;o.month=om+'-01'}
const r=await q(db.from(kind).insert(o).select());await load();say(t('saved'));if(kind=='students')sel=r[0].id;if(kind=='payments'){rc=r[0];scrollTo(0,0)}})});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.open)run(async()=>{const[k,id]=d.open.split(':');if(k=='students'){const[p,v]=await Promise.all([q(db.from('payments').select('*').eq('student_id',id).order('paid_at',{ascending:false})),q(db.from('visits').select('*').eq('student_id',id).order('day',{ascending:false}).limit(60))]);hist={p,v}}det=d.open;sel=0;say('');scrollTo(0,0)});
if(d.mark)run(()=>mark(stu(d.mark)));
if(d.a=='back'){det=0;sel=0;draw()}
if(d.a=='csv'){const cell=x=>{x=String(x??'');if(/^[=+\-@]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'};const rows=[['№',t('name'),t('group'),t('price'),t('paid'),t('debt'),t('attend')],...S.s.map(s=>[s.id,s.full_name,grp(s.group_id)?.name,grp(s.group_id)?.price||0,paid(s.id),left(s),S.mv.filter(v=>v.student_id==s.id).length])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\n')],{type:'text/csv'}));a.download=`report-${om}.csv`;a.click()}
if(d.rc){rc=hist.p.find(p=>p.id==d.rc);draw();scrollTo(0,0)}
if(d.a=='rcx'){rc=null;draw()}
if(d.a=='print')window.print();
if(d.lang){L=+d.lang;try{localStorage.setItem('lang',L)}catch(x){}msg='';draw()}
if(d.a=='theme'){theme=theme=='dark'?'light':'dark';try{localStorage.setItem('theme',theme)}catch(x){}setTheme()}
if(d.a=='png')receiptPng();
if(d.payfor)run(async()=>{det=0;tab='pay';await pick(+d.payfor);scrollTo(0,0)});
if(d.tab){rc=null;det=0;tab=d.tab;sel=0;armed='';say('');run(load)}
if(d.sel)run(async()=>{await pick(+d.sel);scrollTo(0,0)});
if(d.del)run(async()=>{if(armed!=d.del){armed=d.del;return}const[n,id]=d.del.split(':');armed='';await q(db.from(n).delete().eq('id',id));await load()});
if(d.a=='close'){sel=0;draw()}
if(d.a=='dl'){const a=document.createElement('a');a.href=$('bc').toDataURL();a.download=`kod-${sel}.png`;a.click()}
if(d.a=='out')run(async()=>{await db.auth.signOut();user=null;ok=false;say('')})});
document.addEventListener('change',e=>{if(e.target.id=='lang'){L=+e.target.value;try{localStorage.setItem('lang',L)}catch(x){}msg='';draw()}if(e.target.id=='om'){om=e.target.value||now().slice(0,7);sel=0;run(load)}});
document.addEventListener('keydown',e=>{if(e.target.id=='scan'&&e.key=='Enter'){e.preventDefault();const c=e.target.value.trim();run(()=>scan(c))}});
document.addEventListener('input',e=>{if(e.target.id=='find')document.querySelectorAll('.item').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(e.target.value.toLowerCase()))});
run(start);
</script>
</body>
</html>
